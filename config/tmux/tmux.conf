# Canonical tmux config — macOS (Ghostty) locally and the Linux lab hosts over SSH.
#
# Styled to match the Ghostty theme (Catppuccin Mocha, config/ghostty/config.ghostty).
# Deliberately plugin-free: no TPM, so it loads identically on a fresh lab node with
# nothing but `dnf install tmux`. The status bar uses powerline glyphs from
# JetBrainsMono Nerd Font, which is rendered by the Mac terminal even over SSH.
# Needs tmux 3.2+ (%hidden, terminal-features); RHEL 9 ships 3.2a.
#
# Reload after editing:  tmux source-file ~/.tmux.conf

# --- Terminal and colour -------------------------------------------------------
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",xterm-ghostty:RGB:usstyle:overline"
set -as terminal-features ",*:RGB"
set  -g allow-passthrough on

# --- Keys: stock on purpose ----------------------------------------------------
# Prefix stays C-b, splits stay % and ", panes use the arrow keys, windows start at 0,
# copy mode is the default one. Muscle memory then matches a fresh lab node or the CKA
# exam, and C-Space stays free for Neovim. Only looks and behaviour are customised here.
# The accent colour is per host (mauve on the Mac, green over SSH) so nested sessions
# are easy to tell apart.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g @accent "#a6e3a1"' \
  'set -g @accent "#cba6f7"'

# --- Behaviour -----------------------------------------------------------------
set  -g mouse on
set  -s escape-time 0          # no lag when pressing Esc in Vim
set  -g history-limit 100000
set  -g display-time 2000
set  -g focus-events on
# OSC 52: copying in copy mode reaches the Mac clipboard locally and over SSH.
set  -s set-clipboard on
set  -g status-interval 5
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# --- Catppuccin Mocha palette --------------------------------------------------
%hidden BASE="#1e1e2e"
%hidden MANTLE="#181825"
%hidden SURFACE0="#313244"
%hidden SURFACE1="#45475a"
%hidden TEXT="#cdd6f4"
%hidden SUBTEXT0="#a6adc8"
%hidden OVERLAY0="#6c7086"
%hidden BLUE="#89b4fa"
%hidden LAVENDER="#b4befe"
%hidden MAUVE="#cba6f7"
%hidden GREEN="#a6e3a1"
%hidden PEACH="#fab387"
%hidden RED="#f38ba8"

# --- Status bar ----------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=${MANTLE},fg=${SUBTEXT0}"

set -g status-left-length 40
set -g status-right-length 80

# Session name pill in the per-host accent colour. Turns peach while the prefix is held.
set -g status-left "#[bg=#{@accent},fg=${BASE},bold] #{?client_prefix,#[bg=${PEACH}],} #S #[bg=${MANTLE},fg=#{?client_prefix,${PEACH},#{@accent}}]#[none] "

# Host on the left of the right block so you always know which box you are on.
set -g status-right "#[fg=${SURFACE1}]#[bg=${SURFACE1},fg=${SUBTEXT0}] #h #[fg=${SURFACE0},bg=${SURFACE1}]#[bg=${SURFACE0},fg=${LAVENDER}] %a %d %b #[fg=${BLUE},bg=${SURFACE0}]#[bg=${BLUE},fg=${BASE},bold] %H:%M "

# Windows: subdued when inactive, blue pill when active.
set -g window-status-separator ""
set -g window-status-format "#[bg=${MANTLE},fg=${SURFACE1}]#[bg=${SURFACE1},fg=${SUBTEXT0}] #I #W#{?window_zoomed_flag, ,} #[bg=${MANTLE},fg=${SURFACE1}]"
set -g window-status-current-format "#[bg=${MANTLE},fg=${BLUE}]#[bg=${BLUE},fg=${BASE},bold] #I #W#{?window_zoomed_flag, ,} #[bg=${MANTLE},fg=${BLUE}]#[none]"
set -g window-status-activity-style "fg=${PEACH},bold"
set -g window-status-bell-style "fg=${RED},bold"

# --- Panes, messages, copy-mode highlight -------------------------------------
set -g pane-border-style "fg=${SURFACE0}"
set -g pane-active-border-style "fg=${BLUE}"
set -g pane-border-lines single
set -g pane-border-status off

set -g message-style "bg=${SURFACE0},fg=${PEACH},bold"
set -g message-command-style "bg=${SURFACE0},fg=${GREEN},bold"

setw -g mode-style "bg=${SURFACE1},fg=${TEXT}"
set  -g display-panes-active-colour "${BLUE}"
set  -g display-panes-colour "${OVERLAY0}"
set  -g clock-mode-colour "${BLUE}"
