# Canonical tmux config — macOS (Ghostty) locally and the Linux lab hosts over SSH.
#
# Styled to match the Ghostty theme (Catppuccin Mocha, config/ghostty/config.ghostty).
# Deliberately plugin-free: no TPM, so it loads identically on a fresh lab node with
# nothing but `dnf install tmux`. The status bar uses powerline glyphs from
# JetBrainsMono Nerd Font, which is rendered by the Mac terminal even over SSH.
# Needs tmux 3.2+ (%hidden, terminal-features); RHEL 9 ships 3.2a.
#
# Reload after editing:  prefix R   or   tmux source-file ~/.tmux.conf

# --- Terminal and colour -------------------------------------------------------
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-features ",xterm-ghostty:RGB:usstyle:overline:clipboard"
set -as terminal-features ",*:RGB"
set  -g allow-passthrough on

# --- Keys ----------------------------------------------------------------------
# Prefix is the stock C-b; C-b C-b sends a literal C-b to the app (Vim/Neovim page-up).
# Stock keys stay (% " c n p w d [ z x, arrows); h/j/k/l, | and - are added on top.
# No bindings without the prefix, so shells, Vim and Neovim get every normal key.
set -g prefix C-b
unbind C-Space                          # old prefix, in case a running server still has it
bind C-b send-prefix

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Numbering starts at 1, matching the keyboard row.
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# Copy mode: Vim keys, v selects, y copies. Space/Enter still select/copy as in stock vi mode,
# and the emacs-table copy mode keeps working if mode-keys is switched back.
set  -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# The accent colour is per host (mauve on the Mac, green over SSH) so nested sessions
# are easy to tell apart.
if-shell '[ -n "$SSH_CONNECTION" ]' \
  'set -g @accent "#a6e3a1"' \
  'set -g @accent "#cba6f7"'

# --- Behaviour -----------------------------------------------------------------
# Mouse is optional comfort: every operation above also works from the keyboard.
set  -g mouse on
set  -s escape-time 50         # short enough for Vim's Esc, long enough for SSH key sequences
set  -g history-limit 100000
set  -g display-time 2000
set  -g focus-events on
# Clipboard: OSC 52 only, no pbcopy/xclip, so the same line works on the Mac and over SSH
# (the outer terminal, Ghostty, writes the local clipboard). `on` also lets Neovim's own
# OSC 52 copies through.
set  -s set-clipboard on
set  -g status-interval 5
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# --- Catppuccin Mocha palette --------------------------------------------------
%hidden BASE="#1e1e2e"
%hidden MANTLE="#181825"
%hidden SURFACE0="#313244"
%hidden SURFACE1="#45475a"
%hidden TEXT="#cdd6f4"
%hidden SUBTEXT0="#a6adc8"
%hidden OVERLAY0="#6c7086"
%hidden BLUE="#89b4fa"
%hidden LAVENDER="#b4befe"
%hidden MAUVE="#cba6f7"
%hidden GREEN="#a6e3a1"
%hidden PEACH="#fab387"
%hidden RED="#f38ba8"

# --- Status bar ----------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=${MANTLE},fg=${SUBTEXT0}"

set -g status-left-length 40
set -g status-right-length 80

# Session name pill in the per-host accent colour. Turns peach while the prefix is held.
set -g status-left "#[bg=#{@accent},fg=${BASE},bold] #{?client_prefix,#[bg=${PEACH}],} #S #[bg=${MANTLE},fg=#{?client_prefix,${PEACH},#{@accent}}]#[none] "

# Right block: a mode pill (COPY / SYNC / ZOOM, empty otherwise), then host, date, time.
# Host sits first so you always know which box you are on.
set -g status-right "#{?pane_in_mode,#[fg=${GREEN}]#[bg=${GREEN}#,fg=${BASE}#,bold] COPY #[bg=${MANTLE}#,fg=${GREEN}] ,}#{?pane_synchronized,#[fg=${RED}]#[bg=${RED}#,fg=${BASE}#,bold] SYNC #[bg=${MANTLE}#,fg=${RED}] ,}#[fg=${SURFACE1}]#[bg=${SURFACE1},fg=${SUBTEXT0}] #h #[fg=${SURFACE0},bg=${SURFACE1}]#[bg=${SURFACE0},fg=${LAVENDER}] %a %d %b #[fg=${BLUE},bg=${SURFACE0}]#[bg=${BLUE},fg=${BASE},bold] %H:%M "

# Windows: subdued when inactive, blue pill when active.
set -g window-status-separator ""
set -g window-status-format "#[bg=${MANTLE},fg=${SURFACE1}]#[bg=${SURFACE1},fg=${SUBTEXT0}] #I #W#{?window_zoomed_flag, ,} #[bg=${MANTLE},fg=${SURFACE1}]"
set -g window-status-current-format "#[bg=${MANTLE},fg=${BLUE}]#[bg=${BLUE},fg=${BASE},bold] #I #W#{?window_zoomed_flag, ,} #[bg=${MANTLE},fg=${BLUE}]#[none]"
set -g window-status-activity-style "fg=${PEACH},bold"
set -g window-status-bell-style "fg=${RED},bold"

# --- Panes, messages, copy-mode highlight -------------------------------------
# Active border: blue normally, green in copy mode, red while panes are synchronized.
set -g pane-border-style "fg=${SURFACE0}"
set -g pane-active-border-style "#{?pane_in_mode,fg=${GREEN},#{?pane_synchronized,fg=${RED},fg=${BLUE}}}"
set -g pane-border-lines single
set -g pane-border-status off

set -g message-style "bg=${SURFACE0},fg=${PEACH},bold"
set -g message-command-style "bg=${SURFACE0},fg=${GREEN},bold"

setw -g mode-style "bg=${SURFACE1},fg=${TEXT},bold"
set  -g display-panes-active-colour "${BLUE}"
set  -g display-panes-colour "${OVERLAY0}"
set  -g clock-mode-colour "${BLUE}"

# Newer options (popups 3.2+, menu 3.4+, copy-mode match/position 3.5/3.6+). -q makes
# older tmux, such as RHEL 9's 3.2a, skip what it does not know.
set -gq popup-style "bg=${BASE},fg=${TEXT}"
set -gq popup-border-style "fg=${SURFACE1}"
set -gq popup-border-lines rounded
set -gq menu-style "bg=${MANTLE},fg=${TEXT}"
set -gq menu-selected-style "bg=${SURFACE1},fg=${TEXT},bold"
set -gq menu-border-style "fg=${SURFACE1}"
set -gq copy-mode-match-style "bg=${SURFACE1},fg=${TEXT}"
set -gq copy-mode-current-match-style "bg=${PEACH},fg=${BASE},bold"
set -gq copy-mode-mark-style "bg=${RED},fg=${BASE}"
set -gq copy-mode-position-style "bg=${SURFACE0},fg=${LAVENDER}"
