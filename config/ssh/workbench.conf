# Persistent hosts reached through Tailscale MagicDNS. Put User, IdentityFile,
# or a temporary first-contact HostName in 10-hosts.local.conf.
Host rhel-lab ubuntu-lab proxmox
    HostName %h
    ServerAliveInterval 30
    ServerAliveCountMax 4
    ControlMaster auto
    ControlPath ~/.ssh/cm/%C
    ControlPersist 10m
    StrictHostKeyChecking accept-new

Host *
    ForwardAgent no
    ServerAliveInterval 60
    ServerAliveCountMax 3
