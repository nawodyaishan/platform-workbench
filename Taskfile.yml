version: "3"
silent: true

vars:
  ROOT: "{{.TASKFILE_DIR}}"
  SH: "{{.TASKFILE_DIR}}/scripts"
  HOSTS:
    sh: bash -c '. bootstrap/lib/hosts.sh && hosts_list | tr "\n" " "'

tasks:
  default:
    cmds: [{task: help}]

  help:
    desc: Show the command reference (task help -- <command> for one command)
    cmds: ['"{{.SH}}/help.sh" {{.CLI_ARGS}}']

  # --- Lifecycle -------------------------------------------------------------------
  bootstrap:
    desc: Install and wire a profile, locally or on HOST
    cmds: [{task: _lifecycle, vars: {VERB: bootstrap}}]
  update:
    desc: Upgrade profile-managed packages and refresh config
    cmds: [{task: _lifecycle, vars: {VERB: update}}]
  verify:
    desc: Read-only health check, exits 1 on failure
    cmds: [{task: _lifecycle, vars: {VERB: verify}}]
  _lifecycle:
    internal: true
    interactive: true
    cmds:
      - |
        host="{{.HOST}}"
        profile="{{.PROFILE}}"
        if [ -n "$host" ]; then
          [ -z "$profile" ] || { echo 'PROFILE comes from bootstrap/hosts.conf when HOST is set' >&2; exit 2; }
          exec "{{.SH}}/remote.sh" "{{.VERB}}" "$host" {{.CLI_ARGS}}
        fi
        if [ -z "$profile" ] && [ "$(uname -s)" = Darwin ]; then profile=macos; fi
        [ -n "$profile" ] || { echo 'set PROFILE=rhel|ubuntu|proxmox (or HOST=alias from the Mac)' >&2; exit 2; }
        exec "{{.ROOT}}/bootstrap/workbench.sh" "{{.VERB}}" --profile "$profile" {{.CLI_ARGS}}

  verify:all:
    desc: Verify the Mac and every registered host
    cmds:
      - |
        rc=0
        echo "== local =="; task verify PROFILE=macos || rc=1
        for h in {{.HOSTS}}; do
          echo "== $h =="; task verify HOST="$h" || rc=1
        done
        exit "$rc"

  # --- Sessions --------------------------------------------------------------------
  main:
    desc: Attach to or create the local tmux session "main"
    interactive: true
    cmds: ['exec tmux new-session -A -s main']
  ssh:
    desc: SSH to HOST and attach its tmux session "main"
    interactive: true
    requires: {vars: [HOST]}
    cmds: ['ssh -t "{{.HOST}}" ''command -v tmux >/dev/null && exec tmux new-session -A -s main || exec "${SHELL:-/bin/bash}" -l''']
  rhel:
    desc: Open a session on rhel-rhcsa01
    interactive: true
    cmds: [{task: ssh, vars: {HOST: rhel-rhcsa01}}]
  ubuntu:
    desc: Open a session on dev-01
    interactive: true
    cmds: [{task: ssh, vars: {HOST: dev-01}}]
  proxmox:
    desc: Open a session on proxmox
    interactive: true
    cmds: [{task: ssh, vars: {HOST: proxmox}}]

  # --- Hosts -----------------------------------------------------------------------
  hosts:
    desc: List registered hosts, SSH targets and reachability
    cmds: ['"{{.SH}}/remote.sh" hosts']
  ssh:copy-id:
    desc: Install a public key on HOST for first contact
    interactive: true
    requires: {vars: [HOST]}
    cmds: ['"{{.SH}}/remote.sh" copy-id "{{.HOST}}" {{if .KEY}}"{{.KEY}}"{{end}}']
  gh-key:
    desc: Create a distinct GitHub key on HOST
    interactive: true
    requires: {vars: [HOST]}
    cmds: ['"{{.SH}}/remote.sh" gh-key "{{.HOST}}"']
  aliases:
    desc: Copy the paste-in aliases installer to the clipboard
    cmds:
      - |
        if command -v pbcopy >/dev/null 2>&1; then
          "{{.SH}}/aliases-snippet.sh" | pbcopy && echo 'copied: paste into any bash or zsh prompt, e.g. over SSH'
        else
          "{{.SH}}/aliases-snippet.sh"
        fi
  install:aliases:
    desc: Install only the aliases and functions on this machine
    cmds:
      - '"{{.SH}}/aliases-snippet.sh" | bash'

  # --- Install flow for Linux hosts --------------------------------------------------
  # Run these on the host itself. `make install-task` does the same before Task exists.
  install:task:
    desc: Install Task on this Linux host
    cmds: ['"{{.SH}}/install-task.sh" {{.CLI_ARGS}}']
  install:ubuntu:
    desc: Install Task and the ubuntu profile on this host
    interactive: true
    cmds:
      - |
        case " {{.CLI_ARGS}} " in *" --dry-run "*) dry=--dry-run ;; *) dry= ;; esac
        "{{.SH}}/install-task.sh" --distro ubuntu $dry
        exec "{{.ROOT}}/bootstrap/workbench.sh" bootstrap --profile ubuntu {{.CLI_ARGS}}
  install:rhel:
    desc: Install Task and the rhel profile on this host
    interactive: true
    cmds:
      - |
        case " {{.CLI_ARGS}} " in *" --dry-run "*) dry=--dry-run ;; *) dry= ;; esac
        "{{.SH}}/install-task.sh" --distro rhel $dry
        exec "{{.ROOT}}/bootstrap/workbench.sh" bootstrap --profile rhel {{.CLI_ARGS}}
  install:proxmox:
    desc: Install Task and the minimal proxmox profile, as root
    interactive: true
    cmds:
      - |
        case " {{.CLI_ARGS}} " in *" --dry-run "*) dry=--dry-run ;; *) dry= ;; esac
        "{{.SH}}/install-task.sh" --distro proxmox $dry
        exec "{{.ROOT}}/bootstrap/workbench.sh" bootstrap --profile proxmox {{.CLI_ARGS}}
  # Full-stack toolchain on this Ubuntu host: only base, shell (rc wiring), containers, k8s and devstack run.
  devstack:
    desc: Install the full-stack toolchain on this Ubuntu host
    interactive: true
    cmds:
      - '"{{.ROOT}}/bootstrap/workbench.sh" bootstrap --profile ubuntu --extras devstack --only base,shell,containers,k8s,devstack {{.CLI_ARGS}}'
  devstack:update:
    desc: Upgrade Node LTS, Go, Rust, AWS CLI, kind and apt tools
    interactive: true
    cmds:
      - '"{{.ROOT}}/bootstrap/workbench.sh" update --profile ubuntu --extras devstack --only base,shell,containers,k8s,devstack {{.CLI_ARGS}}'
  devstack:verify:
    desc: Read-only check of the dev toolchain
    cmds:
      - '"{{.ROOT}}/bootstrap/workbench.sh" verify --profile ubuntu --extras devstack --only base,shell,containers,k8s,devstack {{.CLI_ARGS}}'
  kk:
    desc: Copy a KodeKloud shell snippet to the clipboard
    cmds:
      - |
        topic="{{.TOPIC}}"
        case "$topic" in
          ''|cka) f="{{.ROOT}}/kodekloud/cka-shell.sh" ;;
          k8s|terraform|aws|ansible|linux) f="{{.ROOT}}/kodekloud/$topic/$topic-shell.sh" ;;
          *) echo "unknown TOPIC '$topic' (cka|k8s|terraform|aws|ansible|linux)" >&2; exit 2 ;;
        esac
        pbcopy < "$f" && echo "copied ${f#"{{.ROOT}}/"}"

  # --- Repository ------------------------------------------------------------------
  lint:
    desc: Syntax-check scripts and validate every config
    cmds:
      - |
        R="{{.ROOT}}"
        rc=0
        scripts="$R/bootstrap/workbench.sh $R/bootstrap/lib/*.sh $R/bootstrap/modules/*.sh $R/bootstrap/profiles/*.sh $R/scripts/*.sh $R/config/shell/*.sh $R/kodekloud/*.sh $R/kodekloud/*/*.sh"
        for f in $scripts "$R/config/shell/bashrc"; do bash -n "$f" || rc=1; done
        zsh -n "$R/config/shell/zshrc" || rc=1
        for shell_cmd in /bin/bash /bin/zsh; do
          if env -i PATH=/usr/bin:/bin WORKBENCH_HOME="$R" "$shell_cmd" -f -c '
            . "$1"
            if ! command -v kubectl >/dev/null 2>&1; then ! alias k >/dev/null 2>&1 || exit 1; fi
            if ! command -v terraform >/dev/null 2>&1; then ! alias tf >/dev/null 2>&1 || exit 1; fi
            if ! command -v tmux >/dev/null 2>&1; then ! alias ta >/dev/null 2>&1 || exit 1; fi
            if ! command -v docker >/dev/null 2>&1; then ! alias dps >/dev/null 2>&1 || exit 1; fi
            if ! command -v brew >/dev/null 2>&1; then ! alias bu >/dev/null 2>&1 || exit 1; fi
            if ! command -v helm >/dev/null 2>&1; then ! alias hm >/dev/null 2>&1 || exit 1; fi
            if ! command -v aws >/dev/null 2>&1; then ! alias awsid >/dev/null 2>&1 || exit 1; fi
            if ! command -v az >/dev/null 2>&1; then ! alias azacc >/dev/null 2>&1 || exit 1; fi
            if ! command -v gcloud >/dev/null 2>&1; then ! alias gcpauth >/dev/null 2>&1 || exit 1; fi
            if ! command -v ansible-playbook >/dev/null 2>&1; then ! alias ap >/dev/null 2>&1 || exit 1; fi
            if ! command -v podman >/dev/null 2>&1; then ! alias pps >/dev/null 2>&1 || exit 1; fi
            if ! command -v tailscale >/dev/null 2>&1; then ! alias tss >/dev/null 2>&1 || exit 1; fi
          ' _ "$R/config/shell/aliases.sh"; then
            echo "ok: $shell_cmd aliases load and optional aliases are guarded"
          else echo "FAIL: $shell_cmd alias source"; rc=1; fi
        done
        snip_dir=$(mktemp -d)
        "$R/scripts/aliases-snippet.sh" > "$snip_dir/snippet"
        printf 'alias mine=true\n' > "$snip_dir/rc"
        for _ in 1 2; do PW_RC="$snip_dir/rc" TMPDIR="$snip_dir" /bin/sh "$snip_dir/snippet" >/dev/null || rc=1; done
        if [ "$(grep -c '^# >>> platform-workbench aliases >>>$' "$snip_dir/rc")" = 1 ] && grep -qx 'alias mine=true' "$snip_dir/rc" \
          && bash -n "$snip_dir/rc" && zsh -n "$snip_dir/rc"; then echo 'ok: aliases paste-in installer is idempotent'
        else echo 'FAIL: aliases paste-in installer'; rc=1; fi
        rm -rf "$snip_dir"
        if command -v shellcheck >/dev/null 2>&1; then
          shellcheck -x -e SC1091 -S warning $scripts && echo 'ok: shellcheck' || rc=1
        else
          echo 'SKIP shellcheck (not installed)'
        fi
        vim -u "$R/config/vim/vimrc" -es -c 'qa!' && echo 'ok: vimrc' || rc=1
        if command -v tmux >/dev/null 2>&1; then
          tmp_socket=$(mktemp -d)
          for mode in local ssh; do
            if [ "$mode" = ssh ]; then export SSH_CONNECTION='lint 0 lint 22'; else unset SSH_CONNECTION; fi
            if output=$(tmux -S "$tmp_socket/$mode.sock" -f "$R/config/tmux/tmux.conf" new-session -d 2>&1); then status=0; else status=$?; fi
            if [ "$status" -eq 0 ] && [ -z "$output" ]; then
              echo "ok: tmux config ($mode)"
              tmux -S "$tmp_socket/$mode.sock" kill-server 2>/dev/null || true
            elif echo "$output" | grep -q 'Operation not permitted'; then
              echo "SKIP tmux runtime check ($mode): sandbox denied socket"
            else
              echo "$output"; rc=1
            fi
          done
          rm -rf "$tmp_socket"
        fi
        gbin=$(command -v ghostty || true)
        [ -n "$gbin" ] || { [ -x /Applications/Ghostty.app/Contents/MacOS/ghostty ] && gbin=/Applications/Ghostty.app/Contents/MacOS/ghostty; }
        if [ -n "$gbin" ]; then
          if output=$("$gbin" +validate-config --config-file="$R/config/ghostty/config.ghostty" 2>&1); then status=0; else status=$?; fi
          if [ "$status" -eq 0 ]; then echo 'ok: Ghostty config'
          elif echo "$output" | grep -q 'SentryInitFailed'; then echo 'SKIP Ghostty validation: sandbox blocked startup'
          else echo "$output"; rc=1; fi
        fi
        git config -f "$R/config/git/gitconfig" --list >/dev/null && echo 'ok: gitconfig' || rc=1
        for host in {{.HOSTS}}; do
          ssh -G -F "$R/config/ssh/workbench.conf" "$host" 2>/dev/null | grep -q '^forwardagent no$' || { echo "FAIL: ssh defaults for $host"; rc=1; }
        done
        [ "$rc" -eq 0 ] && echo 'ok: ssh defaults'
        exit "$rc"
  secrets:
    desc: Scan for credentials and private infrastructure details
    cmds: ['"{{.SH}}/check-secrets.sh"']
  repo:
    desc: Check structure, host registry and Markdown links
    cmds: ['"{{.SH}}/check-repo.sh"']
  check:
    desc: Run lint, secrets and repo checks
    cmds: [{task: lint}, {task: secrets}, {task: repo}]
  test:remote:
    desc: Offline tests for the remote flow and session tasks
    cmds: ['"{{.SH}}/test-remote.sh"']
  test:profiles:
    desc: Container smoke tests for the Linux profiles
    cmds: ['"{{.SH}}/test-profiles.sh" {{.CLI_ARGS}}']
  hooks:
    desc: Install the pre-commit hook
    cmds: ['"{{.SH}}/install-hooks.sh"']
